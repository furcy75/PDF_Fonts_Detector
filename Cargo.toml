[package]
name = "pdf-fonts-detector"
version = "1.1.0"
edition = "2021"
description = "Detect every font used in a PDF, verify installed system fonts on Windows/Linux, download or extract missing fonts, and install them in one click."
license = "MIT"
build = "build.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
lopdf = "0.35"
ttf-parser = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
dirs = "5"
regex = "1"
urlencoding = "2"
png = "0.17"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
